<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador</title>
  <style>
    body {
      background-color: #2b2b2b;
      color: #f0f0f0;
      font-family: sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .contador {
      border: 2px solid #ffffff;
      border-radius: 8px;
      padding: 24px 40px;
      text-align: center;
    }

    #valor {
      font-size: 4rem;
      margin: 0 0 20px;
    }

    button {
      background: transparent;
      color: #f0f0f0;
      border: 1px solid #f0f0f0;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #f0f0f0;
      color: #2b2b2b;
    }
  </style>
</head>
<body>
  <div class="contador">
    <h1 id="valor">0</h1>
    <button onclick="cambiar(-1)">-</button>
    <button onclick="cambiar(1)">+</button>
    <button onclick="reiniciar()">Reiniciar</button>
  </div>

  <script>
    let cuenta = 0;
    const valor = document.getElementById("valor");

    function cambiar(n) {
      cuenta += n;
      valor.textContent = cuenta;
    }

    function reiniciar() {
      cuenta = 0;
      valor.textContent = cuenta;
    }
  </script>
</body>
</html>
